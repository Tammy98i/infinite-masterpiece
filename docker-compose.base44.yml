services:
  app:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - API_PORT=3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - vod-data:/app/server/data
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx concurrently -k -n api,web 'tsx watch server/index.ts' 'vite --port=3000 --host=0.0.0.0'"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || { echo 'API not responding'; exit 1; }; wget -qO- http://127.0.0.1:3000/ >/dev/null || { echo 'Frontend not responding'; exit 1; }"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
  vod-data:
